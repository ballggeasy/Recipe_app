global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    # `backend` resolves to every replica; scrape each one, not whichever the DNS answer lists first.
    dns_sd_configs:
      - names: ['backend']
        type: A
        port: 3000
        refresh_interval: 15s

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
