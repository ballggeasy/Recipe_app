# Load balancer in front of the backend replicas (docker-compose runs several `backend` containers).
# TLS is terminated before this (Caddy on the VM), so this only speaks plain HTTP on port 80.
# Mounted as a directory (not a single file) so edits from a new checkout are picked up.

# Docker's embedded DNS. `resolve` below re-reads the replica addresses every 10 seconds, so replicas
# that are restarted or scaled up and down join and leave without an nginx restart. Not shorter:
# when the address list changes while a request is being retried on another replica, that request
# fails with "no live upstreams" (seen with a 5 second refresh). The deploy script reloads nginx
# after it recreates the replicas, so a deploy does not have to wait for the next refresh.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    # Send each request to the replica with the fewest requests in flight; round robin would
    # keep feeding a replica that is stuck on a slow request.
    least_conn;
    # A replica that fails once is skipped for 5 seconds. One failure is enough on purpose: a replica
    # that is down has no connections, so least_conn would keep choosing it, and a request would be
    # retried on the same dead replica instead of a healthy one.
    server backend:3000 resolve max_fails=1 fail_timeout=5s;
    # Reuse connections to the replicas instead of opening one per request.
    keepalive 32;
}

# Caddy already sets X-Forwarded-Proto; fall back to our own scheme when nginx is hit directly.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# One line per request, with the replica that served it (see `docker compose logs nginx`).
log_format balanced '$remote_addr "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time upstream=$upstream_addr';
access_log /var/log/nginx/access.log balanced;

server {
    listen 80;
    server_name _;

    # Recipe and avatar uploads are limited to 5 MB by the backend (MAX_IMAGE_BYTES); leave room
    # for the multipart envelope. Larger bodies are refused here, before they reach a replica.
    client_max_body_size 6m;

    # Answered by nginx itself, for the container health check: "is the balancer up", not "is a replica up".
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # Appends the address of the hop that connected to nginx (Caddy) to what Caddy sent. The
        # backend counts both proxies (TRUST_PROXY=2) and so ends up at the real client address.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Short, because a stopped replica's address does not refuse the connection, it just does not answer.
        proxy_connect_timeout 1s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # If a replica is down or answers 502/503/504, try another one. Only requests that are
        # safe to repeat are retried (GET/HEAD/PUT/DELETE...); a POST is never sent twice.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
