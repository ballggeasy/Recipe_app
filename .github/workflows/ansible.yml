name: Ansible

on:
  push:
    branches: [main]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible.yml'
  pull_request:
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Syntax check and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ansible-core ansible-lint
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-playbook -i inventory.ini.example playbook.yml --syntax-check
      - run: ansible-lint playbook.yml
      # Behaviour of the deploy script (deploy, rollback, pin) against stub docker/git/curl.
      - run: bash tests/test_recipe_deploy.sh
