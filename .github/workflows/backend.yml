name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  publish:
    name: Publish image to GHCR
    needs: build
    # Only publish from main, never from pull requests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # GitHub-hosted runner: nothing in CI can reach the VM. The VM pulls this
    # image itself (see ansible/roles/deploy_agent).
    runs-on: ubuntu-latest
    # One publish at a time, in push order, so :latest always ends on the newest commit.
    concurrency:
      group: backend-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/recipe-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The org.opencontainers.image.revision label (commit SHA) tells the VM
          # which compose/monitoring config belongs to this image.
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: recipe-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run -d --name smoke -p 3000:3000 -e JWT_SECRET=ci-smoke-test recipe-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/recipes > /dev/null && curl -fsS http://localhost:3000/metrics > /dev/null; then
              echo "Image is healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
