name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  publish:
    name: Publish image to GHCR
    needs: build
    # Only publish from main, never from pull requests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # GitHub-hosted runner: CI can only ask the VM to deploy (last step); the VM
    # pulls this image itself (see ansible/roles/deploy_agent and deploy_webhook).
    runs-on: ubuntu-latest
    # One publish at a time, in push order, so :latest always ends on the newest commit.
    concurrency:
      group: backend-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/recipe-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The org.opencontainers.image.revision label (commit SHA) tells the VM
          # which compose/monitoring config belongs to this image.
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: recipe-backend:ci
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          # The image runs with NODE_ENV=production, which requires a JWT_SECRET of 32+ chars.
          docker run -d --name smoke -p 3000:3000 -e JWT_SECRET=ci-smoke-test-secret-not-used-anywhere-else recipe-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/recipes > /dev/null && curl -fsS http://localhost:3000/metrics > /dev/null \
                && curl -fsS http://localhost:3000/health | grep -q "$GITHUB_SHA"; then
              echo "Image is healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      # The request carries no image or command: the VM's hook only starts its own
      # deploy script, which pulls :latest from GHCR. A missed call is picked up by
      # the VM's fallback timer, so this step never fails the job.
      - name: Ask the VM to deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::notice::Deploy webhook secrets are not set; the VM deploys on its next timer run."
            exit 0
          fi
          body=$(jq -cn --arg revision "$GITHUB_SHA" '{revision: $revision}')
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" -r | cut -d' ' -f1)
          if ! curl -fsS --retry 3 --retry-all-errors --max-time 20 -X POST \
              -H 'Content-Type: application/json' -H "X-Signature: $signature" \
              --data "$body" "$DEPLOY_WEBHOOK_URL"; then
            echo "::warning::Could not reach the deploy webhook; the VM deploys on its next timer run."
          fi
