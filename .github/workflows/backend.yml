name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.github/scripts/smoke-image.sh'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.github/scripts/smoke-image.sh'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless. Never cancel runs on main.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --omit=dev
      # Fails on high/critical advisories in what actually ships. Moderates are reviewed in docs/SECURITY.md.
      - run: npm audit --omit=dev --audit-level=high

  image:
    name: Docker image builds and starts
    # Pull requests only: validates the Dockerfile before merge without publishing anything.
    # Pushes to main build and smoke test the same image in the publish job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: recipe-backend:ci
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
      - name: Smoke test image
        run: bash .github/scripts/smoke-image.sh recipe-backend:ci "$GITHUB_SHA"

  publish:
    name: Publish image to GHCR
    needs: [check, audit]
    # Only publish from main, never from pull requests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # GitHub-hosted runner: CI can only ask the VM to deploy (last step); the VM
    # pulls this image itself (see ansible/roles/deploy_agent and deploy_webhook).
    runs-on: ubuntu-latest
    # One publish at a time, in push order, so :latest always ends on the newest commit.
    concurrency:
      group: backend-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/recipe-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The org.opencontainers.image.revision label (commit SHA) tells the VM
          # which compose/monitoring config belongs to this image. The immutable
          # sha-<commit> tag is what a rollback deploys (see docs/DEPLOYMENT.md).
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: recipe-backend:ci
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: bash .github/scripts/smoke-image.sh recipe-backend:ci "$GITHUB_SHA"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      # The request carries no image or command: the VM's hook only starts its own
      # deploy script, which pulls :latest from GHCR. A missed call is picked up by
      # the VM's fallback timer, so this step never fails the job.
      - name: Ask the VM to deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::notice::Deploy webhook secrets are not set; the VM deploys on its next timer run."
            exit 0
          fi
          body=$(jq -cn --arg revision "$GITHUB_SHA" '{revision: $revision}')
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" -r | cut -d' ' -f1)
          if ! curl -fsS --retry 3 --retry-all-errors --max-time 20 -X POST \
              -H 'Content-Type: application/json' -H "X-Signature: $signature" \
              --data "$body" "$DEPLOY_WEBHOOK_URL"; then
            echo "::warning::Could not reach the deploy webhook; the VM deploys on its next timer run."
          fi
