name: Frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-test:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build:
    name: Build Android debug APK
    # Proves the app compiles for a real target, which analyze and the widget tests do not,
    # and keeps the APK as a run artifact so it can be installed on a phone.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true
      - run: flutter pub get
      # Without the Azure config the app falls back to 10.0.2.2, which only an emulator can reach.
      - run: flutter build apk --debug --dart-define-from-file=config/azure.json
      - uses: actions/upload-artifact@v4
        with:
          name: recipe-app-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
