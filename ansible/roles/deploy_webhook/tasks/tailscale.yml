# Tailscale Funnel gives the webhook a public HTTPS URL without opening a port on the
# VM's network. Funnel must be allowed for this node in the tailnet policy, and HTTPS
# certificates enabled (admin console → DNS).
- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable and start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    state: started
    enabled: true

- name: Read Tailscale status
  ansible.builtin.command: tailscale status --json
  register: deploy_webhook_ts_status
  changed_when: false
  failed_when: false

- name: Parse Tailscale status
  ansible.builtin.set_fact:
    deploy_webhook_ts: "{{ deploy_webhook_ts_status.stdout | default('{}', true) | from_json }}"

- name: Require an auth key to join the tailnet
  ansible.builtin.assert:
    that: tailscale_authkey is defined and tailscale_authkey | length > 0
    fail_msg: >-
      This VM is not logged in to Tailscale. Create an auth key in the Tailscale admin console
      (Settings → Keys) and run the playbook again with -e tailscale_authkey=tskey-auth-...
  when: deploy_webhook_ts.BackendState | default('') != 'Running'

- name: Join the tailnet
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--authkey={{ tailscale_authkey }}"
      - "--hostname={{ tailscale_hostname }}"
  when: deploy_webhook_ts.BackendState | default('') != 'Running'
  changed_when: true
  no_log: true

- name: Read Funnel status
  ansible.builtin.command: tailscale funnel status --json
  register: deploy_webhook_funnel_status
  changed_when: false

# `timeout` so a tailnet without Funnel enabled fails instead of waiting for a click in the browser.
- name: Serve the webhook port through Funnel
  ansible.builtin.command: "timeout 60 tailscale funnel --bg {{ deploy_webhook_port }}"
  when: >-
    'AllowFunnel' not in deploy_webhook_funnel_status.stdout
    or ('127.0.0.1:' ~ deploy_webhook_port) not in deploy_webhook_funnel_status.stdout
  changed_when: true

- name: Read Tailscale DNS name
  ansible.builtin.command: tailscale status --json
  register: deploy_webhook_ts_status_after
  changed_when: false

- name: Show the webhook URL for the DEPLOY_WEBHOOK_URL GitHub secret
  ansible.builtin.debug:
    msg: "https://{{ (deploy_webhook_ts_status_after.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}/hooks/recipe-deploy"
