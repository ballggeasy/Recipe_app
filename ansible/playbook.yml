# Prepares the VM to run the backend and keep it updated from GHCR.
#
#   ansible-playbook playbook.yml -K
- name: Prepare recipe backend VM
  hosts: recipe_vm
  become: true
  pre_tasks:
    - name: Only Debian/Ubuntu hosts are supported
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
        fail_msg: "Unsupported OS family: {{ ansible_facts['os_family'] }}"
  roles:
    - docker
    - app_env
    - deploy_agent
    - role: reverse_proxy
      when: api_domain | length > 0
    - role: deploy_webhook
      when: manage_deploy_webhook | bool
    - role: firewall
      when: manage_ufw | bool
