# Directory on the VM that holds the secret env file and the repo checkout.
app_dir: /opt/recipe-backend
app_env_file: "{{ app_dir }}/.env"

# The VM always pulls the image CI publishes from main itself; nothing in GitHub can
# run code on the VM. CI only asks for a deploy through a signed webhook call.
deploy_user: recipe-deploy
deploy_repo_url: https://github.com/ballggeasy/Recipe_app.git
deploy_repo_dir: "{{ app_dir }}/repo"
# Image repository on GHCR. The deploy script pulls :latest to learn the newest revision, then runs
# the immutable tag :sha-<revision> so a rollback can start exactly the revision that was running.
backend_image_repo: ghcr.io/ballggeasy/recipe-backend
# Fallback poll, for a webhook call that never arrived (VM offline, tunnel down).
deploy_interval: 1h

# Webhook CI calls after publishing an image, exposed through Tailscale Funnel.
# First run needs -e tailscale_authkey=tskey-auth-... (never commit the key).
manage_deploy_webhook: true
deploy_webhook_port: 9000
deploy_webhook_env_file: "{{ app_dir }}/webhook.env"
deploy_request_file: "{{ app_dir }}/.deploy-request"
tailscale_hostname: recipe-vm

# HTTPS for the API. Caddy gets a Let's Encrypt certificate for this name, which must resolve to
# the VM (Azure: Public IP -> Configuration -> DNS name label) with ports 80 and 443 open in the
# network firewall. Leave empty to skip the proxy and serve plain HTTP on backend_port.
api_domain: recipe-backend-psu.malaysiawest.cloudapp.azure.com
backend_port: 3000

# Identical backend containers behind nginx (docker-compose). They share one SQLite file and the
# uploads volume, so they all run on this VM. Node runs JavaScript on one thread, so about one
# replica per CPU core is where more replicas stop adding throughput.
backend_replicas: 2

# Optional host firewall (ufw). The network firewall in front of the VM is separate.
manage_ufw: false
ufw_open_ports:
  - 80    # ACME challenge + redirect to HTTPS (reverse proxy)
  - 443   # HTTPS API (reverse proxy)
  - 3000  # backend API (not needed when the proxy is used)
  - 3001  # Grafana
